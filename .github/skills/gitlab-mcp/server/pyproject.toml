[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-review-mcp"
version = "0.1.0"
description = "MCP server for GitLab merge request and issue review workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.12.0,<2",
  "httpx>=0.28.1",
  "truststore>=0.10.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0"
]

[project.scripts]
gitlab-review-mcp = "gitlab_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
