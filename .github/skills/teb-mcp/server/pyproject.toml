[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teb-mcp"
version = "0.1.0"
description = "MCP server for the Nuvoton TEB (Test Environment Board) FPGA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.12.0,<2"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0"
]

[project.scripts]
teb-mcp = "teb_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"teb_mcp.worker" = ["*.py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
